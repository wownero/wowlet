name: macos build (gitea self-hosted)

# Runs ONLY on the Gitea mac runner (GitHub ignores .gitea/workflows).
# Dispatch-only: the mac runner has capacity 1 and also serves the Hash Bags
# iOS lane, so macOS wowlet builds are an explicit button, not a push hook.
# All build state lands under the runner's work dir, which lives on
# /Volumes/DataSSD (never backed up: the fleet backup pulls an allowlist of
# gitea data only).
#
# Signing/notarization uses the SAME seven secrets as the smirk-monorepo
# desktop lane, set by ~/keys/suchsoftware/set-gitea-desktop-secrets.sh:
#   APPLE_CERTIFICATE (b64 Developer ID Application .p12),
#   APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID,
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8_BASE64 (notarytool).
# Missing signing or notarization inputs refuse before compilation.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed Builds commit
        required: true
        type: string

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  build-macos:
    name: "macOS (brew, native)"
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.sha }}

      - name: Verify exact reviewed source
        run: python3 -B contrib/release/check_dispatch.py

      - name: Check signing inputs before compiling
        run: python3 -B contrib/release/sign_macos.py --check-inputs

      - name: Verify Fleet-managed build dependencies
        run: |
          set -e
          export PATH="/opt/homebrew/bin:$PATH"
          for formula in qt libsodium libzip qrencode unbound cmake boost hidapi openssl expat protobuf zxing-cpp; do
            brew --prefix "$formula" >/dev/null || {
              echo "Missing Fleet-managed build dependency: $formula" >&2
              exit 1
            }
          done

      - name: fetch verified wownerod to embed
        run: |
          set -e
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin11 ;;
            x86_64) target=x86_64-apple-darwin11 ;;
            *) echo "Unsupported macOS build architecture" >&2; exit 1 ;;
          esac
          EMBED="/tmp/wowlet-${GITHUB_RUN_ID}/wownerod-embed"
          python3 -B contrib/release/fetch_wownerod.py --target "$target" --destination "$EMBED"
          echo "WOWNEROD_DIR=$EMBED" >> "$GITHUB_ENV"

      - name: fetch tor to embed
        run: |
          set -e
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64) TORTAR=tor-expert-bundle-macos-aarch64-15.0.tar.gz ;;
            *)     TORTAR=tor-expert-bundle-macos-x86_64-15.0.tar.gz ;;
          esac
          mkdir -p /tmp/teb /tmp/tor-embed
          curl -L -o /tmp/teb.tgz "https://archive.torproject.org/tor-package-archive/torbrowser/15.0/$TORTAR"
          tar xzf /tmp/teb.tgz -C /tmp/teb
          cp /tmp/teb/tor/tor /tmp/teb/tor/libevent-*.dylib /tmp/tor-embed/
          # tor ships UNSIGNED; arm64 macOS SIGKILLs unsigned binaries. Ad-hoc sign
          # BEFORE embedding — the signature travels inside the file, so the copy
          # the app unpacks at runtime on user machines is runnable too.
          codesign -s - -f /tmp/tor-embed/tor /tmp/tor-embed/libevent-*.dylib
          chmod +x /tmp/tor-embed/tor
          # expert-bundle RELEASE number (15.0) is NOT the tor version — derive it
          TORVER=$(/tmp/tor-embed/tor --version | grep -oE '[0-9]+(\.[0-9]+){3}' | head -1)
          echo "TOR_VERSION=$TORVER" >> "$GITHUB_ENV"
          echo "embedded tor version: $TORVER"

      - name: build
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # clang does not search /opt/homebrew/include by default; the feather
          # target pulls monero headers that include boost, and modern Boost's
          # CMake config leaves Boost_INCLUDE_DIRS empty. CPATH/LIBRARY_PATH make
          # every linked brew header/lib findable without per-dep flag surgery.
          export CPATH="$(brew --prefix)/include"
          export LIBRARY_PATH="$(brew --prefix)/lib"
          mkdir -p build && cd build
          cmake -DWITH_SCANNER=OFF -DUSE_DEVICE_TREZOR=OFF -DBoost_USE_STATIC_LIBS=ON -DWOWNEROD_DIR="$WOWNEROD_DIR" -DTOR_DIR=/tmp/tor-embed -DTOR_VERSION="$TOR_VERSION" -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" ..
          cmake --build . -j "$(sysctl -n hw.ncpu)"

      - name: package app bundle
        run: |
          set -e
          cd build
          APP=$(find . -maxdepth 3 -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "no .app bundle produced"; ls -la bin/; exit 1; }
          mkdir -p dist
          cp -R "$APP" dist/Wowlet.app
          # cmake never places the icon in the bundle (upstream only copies it
          # for the dormant `installed/` layout)
          mkdir -p dist/Wowlet.app/Contents/Resources
          cp ../src/assets/images/appicons/appicon.icns dist/Wowlet.app/Contents/Resources/
          # bundle Qt frameworks/plugins so the app runs off-machine.
          # -qmldir is not optional: our QML lives in .qrc resources, which
          # macdeployqt cannot scan, so without it the bundle ships no QML
          # modules at all and every page importing anything beyond QtQuick
          # fails to load. That is how 5.1.2 shipped a grey mining tab on mac
          # while Linux was fine: Contents/Resources held no qml directory, and
          # the app logged 'module "QtQuick.Layouts" is not installed'.
          /opt/homebrew/opt/qt/bin/macdeployqt dist/Wowlet.app -qmldir=../src/assets/qml

          # qmlimportscanner reads only the `import` lines in our QML and does
          # not follow a module's own qmldir depends chain, so transitive
          # modules (QtQuick -> QtQml.WorkerScript/Models) are silently skipped.
          # The AppImage build hit this twice and blanket-copies the trees; do
          # the same here, before the dylib passes below so their deps resolve.
          # Ask Qt where its QML modules live rather than assuming a brew
          # layout; the AppImage build asks qmake the same question.
          QTPREFIX="$(brew --prefix qt)"
          QMLSRC="$("$QTPREFIX/bin/qmake6" -query QT_INSTALL_QML 2>/dev/null || echo "$QTPREFIX/share/qt/qml")"
          [ -d "$QMLSRC" ] || { echo "ERROR: Qt QML modules not found at $QMLSRC" >&2; exit 1; }
          mkdir -p dist/Wowlet.app/Contents/Resources/qml
          for m in QtQuick QtQml; do
            cp -Rn "$QMLSRC/$m" dist/Wowlet.app/Contents/Resources/qml/ 2>/dev/null || true
          done

          # Guard: the module the mining tab needs has to be in the bundle. A
          # missing QML module is invisible until someone opens the tab, so it
          # fails the build instead of shipping a page that paints grey.
          for m in QtQuick QtQuick/Layouts; do
            [ -d "dist/Wowlet.app/Contents/Resources/qml/$m" ] || {
              echo "ERROR: $m missing from the bundle; QML pages will not load" >&2
              exit 1
            }
          done

          # macdeployqt bundles Qt frameworks but not the plain-dylib brew deps
          # of Qt's image plugins (libwebp/libsharpyuv/libbrotli...), which are
          # referenced as @rpath/lib*.dylib. Without them a clean (no-Homebrew)
          # Mac can't load those image formats. Qt frameworks use a different
          # ref form (@rpath/Qt*.framework/...), so keying strictly on
          # `@rpath/*.dylib` bundles the stragglers WITHOUT touching Qt.
          # Several passes converge (a bundled lib pulls in further deps).
          APP=dist/Wowlet.app
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"
          for pass in 1 2 3 4; do
            while IFS= read -r macho; do
              file "$macho" | grep -q Mach-O || continue
              chmod u+w "$macho"
              otool -L "$macho" | awk 'NR>1{print $1}' | while IFS= read -r dep; do
                case "$dep" in
                  @rpath/*.dylib)
                    name=$(basename "$dep")
                    if [ -f "$FW/$name" ]; then
                      install_name_tool -change "$dep" "@executable_path/../Frameworks/$name" "$macho" 2>/dev/null || true
                      continue
                    fi
                    real=$(find /opt/homebrew/lib /opt/homebrew/opt/*/lib -maxdepth 1 -name "$name" 2>/dev/null | head -1)
                    if [ -n "$real" ]; then
                      cp -n "$real" "$FW/$name"
                      chmod u+w "$FW/$name"
                      install_name_tool -id "@executable_path/../Frameworks/$name" "$FW/$name" 2>/dev/null || true
                      install_name_tool -change "$dep" "@executable_path/../Frameworks/$name" "$macho" 2>/dev/null || true
                    fi
                    ;;
                esac
              done
            done < <(find "$APP" -type f)
          done

          # Fail if any @rpath/*.dylib (non-Qt) remains unresolved in the bundle
          leftover=$(find "$APP" -type f | while IFS= read -r m; do
            file "$m" | grep -q Mach-O || continue
            otool -L "$m" | awk 'NR>1{print $1}' | grep -E '^@rpath/[^/]+\.dylib$' || true
          done | sort -u)
          if [ -n "$leftover" ]; then
            echo "UNBUNDLED @rpath dylibs remain:"; echo "$leftover"; exit 1
          fi
          echo "all plain-dylib deps bundled"
          ls -la "$FW" | grep -iE "webp|sharpyuv|brotli" || true
          ls -la dist/

      - name: Sign and notarize the private candidate
        run: python3 -B contrib/release/sign_macos.py

      - name: zip artifact
        run: |
          set -e
          cd build/dist
          ditto -c -k --keepParent Wowlet.app ../wowlet-macos-$(uname -m).zip
          ls -la ../wowlet-macos-*.zip

      - name: upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: wowlet-macos
          path: build/wowlet-macos-*.zip
          retention-days: 14
          # Without this an empty upload passes silently, which is how a signed
          # build can appear to publish while shipping nothing.
          if-no-files-found: error
